  #      timeout: 5s
  #      retries: 5

  standalone:
    container_name: milvus-standalone
    image: milvusdb/milvus:v2.6.7
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MQ_TYPE: woodpecker
      # milvus 账号权限
      COMMON_SECURITY_AUTHORIZATION_ENABLED: true
      COMMON_SECURITY_SUPER_USERS: root
      COMMON_SECURITY_DEFAULT_ROOT_PASSWORD: admin123

    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/milvus:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - "etcd"
      - "minio"

  redis:
    container_name: milvus-redis
    image: redis/redis-stack:latest
    ports:
      - "6380:6379"        # 宿主机端口 6380 → 容器 6379（6379 已被本机其他 Redis 占用，故改用 6380）
      - "8002:8001"        # RedisInsight Web UI（可选，浏览器访问 http://localhost:8002）
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  attu:
    container_name: milvus-attu
    image: zilliz/attu:v2.6
    ports:
      - "8001:3000"        # 在浏览器访问 http://localhost:8001
    environment:
      MILVUS_URL: standalone:19530   # 通过 compose 网络名访问 Milvus
    depends_on:
      - "standalone"

networks:
  default:
    name: milvus